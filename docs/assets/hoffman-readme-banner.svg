<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">HoffMan project banner</title>
  <desc id="desc">The approved HoffMan C3 lockup and a predictive rolling-denoising planning summary, balanced on a dark technical background.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171817"/>
      <stop offset="0.72" stop-color="#262725"/>
      <stop offset="1" stop-color="#171817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.70">
      <stop offset="0" stop-color="#7895A6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#171817" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#676A66" stroke-width="1" opacity="0.12"/>
    </pattern>

    <!-- Approved C3 lockup, copied verbatim from doc/icon/hoffman-c3-lockup-on-dark.svg. -->
    <symbol id="approved-hoffman-lockup" viewBox="-1.75 -1.75 384 128">
      <g id="layer-lockup">
        <g id="layer-symbol">
          <g id="state-sequence" data-color="#7895A6" data-trend="strictly-increasing">
            <rect id="state-1" data-role="state" data-order="1" data-magnitude="18" x="26" y="60" width="18" height="18" rx="3" fill="#7895A6"/>
            <rect id="state-2" data-role="state" data-order="2" data-magnitude="28" x="50" y="50" width="18" height="28" rx="3" fill="#A9BEC8"/>
            <rect id="state-3" data-role="state" data-order="3" data-magnitude="40" x="74" y="38" width="18" height="40" rx="3" fill="#D3DDE1"/>
            <rect id="state-4" data-role="state" data-order="4" data-magnitude="51" x="98" y="25" width="18" height="51" rx="3" fill="none" stroke="#D3DDE1" stroke-width="4"/>
          </g>
          <g id="neutral-structure">
            <polyline id="horizon-1" data-role="horizon" points="20.0,83 360.5,83" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g id="action-cue" data-color="#E7A12B" data-asymmetry="clustered">
            <rect id="action-1" data-role="action" x="26" y="88.5" width="18" height="6" rx="3" fill="#E7A12B"/>
            <rect id="action-2" data-role="action" x="50" y="88.5" width="18" height="6" rx="3" fill="#E7A12B"/>
            <rect id="action-3" data-role="action" x="74" y="88.5" width="18" height="13" rx="3" fill="#E7A12B"/>
            <rect id="action-4" data-role="action" x="98" y="90" width="18" height="6" rx="3" fill="none" stroke="#E7A12B" stroke-width="3"/>
          </g>
        </g>
        <g id="layer-wordmark">
          <text id="wordmark-native" x="130" y="78" fill="#FFFFFF" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6">Hoff<tspan fill="#E7A12B">Man</tspan></text>
          <text id="descriptor-native" x="130" y="96.5" fill="#ECECEA" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="11">HIERARCHICAL ACTION-LEVEL DIFFUSION</text>
        </g>
      </g>
    </symbol>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#ground)"/>
  <rect width="1400" height="360" rx="28" fill="url(#glow)"/>
  <rect x="28" y="28" width="1344" height="304" rx="20" fill="url(#grid)" stroke="#676A66" stroke-width="1" opacity="0.72"/>

  <use href="#approved-hoffman-lockup" x="92" y="88" width="560" height="187"/>

  <line x1="720" y1="82" x2="720" y2="278" stroke="#777874" stroke-width="1"/>

  <g font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif">
    <text x="790" y="112" fill="#E7A12B" font-size="15" font-weight="700" letter-spacing="2.8">PREDICT · PLAN · ACT</text>
    <text x="790" y="160" fill="#ECECEA" font-size="30" font-weight="700">Predictive rolling-</text>
    <text x="790" y="196" fill="#ECECEA" font-size="30" font-weight="700">denoising planning</text>
    <text x="790" y="236" fill="#BBBCB8" font-size="16">Future states stay internal.</text>
    <text x="790" y="261" fill="#BBBCB8" font-size="16">Selected actions reach the robot.</text>
  </g>

  <g transform="translate(790 286)" aria-label="state to planning to action flow">
    <rect width="88" height="26" rx="13" fill="#7895A6"/>
    <text x="44" y="18" text-anchor="middle" fill="#171817" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700">STATE</text>
    <path d="M96 13H124" stroke="#ECECEA" stroke-width="2" stroke-linecap="round"/>
    <path d="m119 8 7 5-7 5" fill="none" stroke="#ECECEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="136" width="98" height="26" rx="13" fill="#ECECEA" stroke="#E7A12B" stroke-width="2"/>
    <text x="185" y="18" text-anchor="middle" fill="#2F2F2D" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700">PRDP</text>
    <path d="M242 13H270" stroke="#ECECEA" stroke-width="2" stroke-linecap="round"/>
    <path d="m265 8 7 5-7 5" fill="none" stroke="#ECECEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="282" width="92" height="26" rx="13" fill="#E7A12B"/>
    <text x="328" y="18" text-anchor="middle" fill="#171817" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700">ACTION</text>
  </g>
</svg>
